name: safe-core-ci

on:
  push:
    branches: [ main, safe-core ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-linux:
    name: Static and safety policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize Safe Core source
        run: python ci/materialize.py
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Repository contract
        run: python -m pytest -q tests/ci/test_repo_contract.py
      - name: Safe Core policy
        run: python -m pytest -q tests/ci/test_safety_policy.py
      - name: Existing static validator
        run: python tools/validate_source.py
      - name: Backend tests
        working-directory: web/backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          python -m pytest -q

  windows-ps51:
    name: Windows PowerShell 5.1 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize Safe Core source
        shell: powershell
        run: python ci/materialize.py
      - name: PS5.1 identity
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)" }
          Write-Host "PS51_IDENTITY=PASS version=$($PSVersionTable.PSVersion)"
      - name: PS5.1 parse all source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $errs = @()
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 -File | Where-Object { $_.FullName -notmatch '[\\/]dist[\\/]' } | ForEach-Object {
            $tokens=$null; $parse=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parse)
            foreach($e in @($parse)){ $errs += "$($_.FullName): $($e.Message)" }
          }
          if($errs.Count){ throw ($errs -join "`n") }
          Write-Host 'PS51_PARSE_ALL=PASS'
      - name: Import Core module
        shell: powershell
        run: Import-Module .\engine\Core.psm1 -Force -ErrorAction Stop; Write-Host 'IMPORT_CORE=PASS'
      - name: Import State module
        shell: powershell
        run: Import-Module .\engine\State.psm1 -Force -ErrorAction Stop; Write-Host 'IMPORT_STATE=PASS'
      - name: Import Detection module
        shell: powershell
        run: Import-Module .\engine\Detection.psm1 -Force -ErrorAction Stop; Write-Host 'IMPORT_DETECTION=PASS'
      - name: Import Network module
        shell: powershell
        run: Import-Module .\engine\Network.psm1 -Force -ErrorAction Stop; Write-Host 'IMPORT_NETWORK=PASS'
      - name: Import Download module
        shell: powershell
        run: Import-Module .\engine\Download.psm1 -Force -ErrorAction Stop; Write-Host 'IMPORT_DOWNLOAD=PASS'
      - name: Import Security module
        shell: powershell
        run: Import-Module .\engine\Security.psm1 -Force -ErrorAction Stop; Write-Host 'IMPORT_SECURITY=PASS'
      - name: Import Evidence module
        shell: powershell
        run: Import-Module .\engine\Evidence.psm1 -Force -ErrorAction Stop; Write-Host 'IMPORT_EVIDENCE=PASS'
      - name: Import Runtime module
        shell: powershell
        run: Import-Module .\engine\Runtime.psm1 -Force -ErrorAction Stop; Write-Host 'IMPORT_RUNTIME=PASS'
      - name: Config smoke
        shell: powershell
        run: |
          Import-Module .\engine\Core.psm1 -Force -ErrorAction Stop
          $cfg=Get-MLLMConfig -ProjectRoot (Get-Location).Path
          if($null -eq $cfg){throw 'Get-MLLMConfig returned null'}
          Write-Host 'CONFIG_SMOKE=PASS'
      - name: Task registry smoke
        shell: powershell
        run: |
          foreach($m in @('Core','State','Detection','Network','Download','Security','Evidence','Runtime')) { Import-Module ".\engine\$m.psm1" -Force -ErrorAction Stop }
          Import-MLLMTasks -ProjectRoot (Get-Location).Path
          $tasks=@(Get-MLLMRegisteredTasks)
          if($tasks.Count -lt 1){throw 'No tasks registered'}
          Write-Host "TASK_REGISTRY_SMOKE=PASS count=$($tasks.Count)"
      - name: Safe Core offline install smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-SafeCoreOfflineSmoke.ps1
      - name: Normal Doctor offline smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-NormalDoctorOfflineSmoke.ps1
      - name: XAML XML parse smoke
        shell: powershell
        run: |
          [xml]$xaml=Get-Content -LiteralPath .\gui\Workbench.xaml -Raw -Encoding UTF8
          if($null -eq $xaml){throw 'XAML XML parse returned null'}
          Write-Host 'XAML_XML_PARSE=PASS'
      - name: WPF XAML load smoke
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\ci\Invoke-WpfLoadSmoke.ps1
      - name: Standalone Emergency Doctor smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-EmergencyDoctorSmoke.ps1

  no-paid-services:
    name: CI billing guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize Safe Core source
        run: python ci/materialize.py
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Reject metered AI actions, larger runners, and storage uploads
        run: python -m pytest -q tests/ci/test_ci_billing.py

  cold-checkout-bootstrap:
    name: Raw checkout bootstrap / Windows 2022
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cold checkout launcher smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'mllm-cold-checkout-data'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Start_M_LLM_Workbench.ps1 -Cli -DataRoot $dataRoot -NetworkMode OFFLINE_CACHE
          if ($LASTEXITCODE -ne 0) { throw "Cold checkout launcher failed rc=$LASTEXITCODE" }
          Write-Host 'COLD_CHECKOUT_BOOTSTRAP=PASS'

  cold-entrypoints:
    name: Raw checkout ${{ matrix.scenario }} / Windows 2022
    strategy:
      fail-fast: false
      matrix:
        scenario: [doctor, core]
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Cold checkout Doctor
        if: matrix.scenario == 'doctor'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'mllm-cold-doctor-data'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Start_M_LLM_Workbench.ps1 -Doctor -DataRoot $dataRoot -NetworkMode OFFLINE_CACHE
          if ($LASTEXITCODE -ne 0) { throw "Cold checkout Doctor failed rc=$LASTEXITCODE" }
          $summaryPath = Get-ChildItem -LiteralPath $dataRoot -Recurse -Filter summary.json -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $summaryPath) { throw 'Cold checkout Doctor did not write summary.json' }
          $items = @(Get-Content -LiteralPath $summaryPath.FullName -Raw -Encoding UTF8 | ConvertFrom-Json)
          if ($items.Count -lt 8) { throw "Cold checkout Doctor returned too few checks: $($items.Count)" }
          foreach ($required in @('system.os','system.disk','filesystem.permissions','python.interpreter','llama.runtime','model.qwen35-4b','runtime.health','runtime.chat')) {
            if (@($items.id) -notcontains $required) { throw "Cold checkout Doctor missing required check: $required" }
          }
          Write-Host "COLD_CHECKOUT_DOCTOR=PASS count=$($items.Count)"
      - name: Cold checkout Core fail-closed
        if: matrix.scenario == 'core'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'mllm-cold-core-data'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $oldPath = $env:Path
          try {
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            & $ps -NoProfile -ExecutionPolicy Bypass -File .\Start_M_LLM_Workbench.ps1 -Preset Core -Cli -DataRoot $dataRoot -NetworkMode OFFLINE_CACHE
            $rc = $LASTEXITCODE
          } finally {
            $env:Path = $oldPath
          }
          if ($rc -ne 1) { throw "Cold checkout offline Core must fail closed with rc=1, got rc=$rc" }
          $executables = @(Get-ChildItem -LiteralPath $dataRoot -Recurse -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($executables.Count -ne 0) { throw ('Cold checkout offline Core created executable(s): ' + (($executables.FullName) -join ', ')) }
          $summaryPath = Get-ChildItem -LiteralPath $dataRoot -Recurse -Filter summary.json -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $summaryPath) { throw 'Cold checkout Core did not write summary.json' }
          $items = @(Get-Content -LiteralPath $summaryPath.FullName -Raw -Encoding UTF8 | ConvertFrom-Json)
          if (@($items | Where-Object {$_.status -eq 'BLOCKED'}).Count -lt 1) { throw 'Cold checkout offline Core did not return BLOCKED' }
          if (@($items | Where-Object {$_.status -eq 'FAILED'}).Count -ne 0) { throw 'Cold checkout offline Core returned FAILED instead of fail-closed BLOCKED' }
          Write-Host "COLD_CHECKOUT_CORE_FAIL_CLOSED=PASS count=$($items.Count)"
