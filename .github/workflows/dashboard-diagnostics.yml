name: dashboard-diagnostics

on:
  push:
    branches: [ safe-core ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-diagnostics:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dashboard diagnostics
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-DashboardDiagnostics.ps1
      - name: Real GUI snapshot smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-GuiSnapshotSmoke.ps1
