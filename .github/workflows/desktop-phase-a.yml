name: desktop-phase-a

on:
  push:
    branches:
      - feature/desktop-phase-a
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts RED/GREEN / Windows 2022
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: .NET 8 identity
        shell: powershell
        run: dotnet --info
      - name: Contracts tests
        shell: powershell
        run: dotnet test tests/contracts/MLLM.Workbench.Contracts.Tests/MLLM.Workbench.Contracts.Tests.csproj -c Release
