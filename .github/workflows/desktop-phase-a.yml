name: desktop-phase-a

on:
  push:
    branches:
      - feature/desktop-phase-a
  pull_request:

permissions:
  contents: read

jobs:
  phase-a-foundation:
    name: Desktop Phase A Foundation / Windows 2022
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: .NET 8 identity
        shell: powershell
        run: dotnet --info
      - name: Contracts tests
        shell: powershell
        run: dotnet test tests/contracts/MLLM.Workbench.Contracts.Tests/MLLM.Workbench.Contracts.Tests.csproj -c Release
      - name: Infrastructure pipe tests
        shell: powershell
        run: dotnet test tests/infrastructure/MLLM.Workbench.Infrastructure.Tests/MLLM.Workbench.Infrastructure.Tests.csproj -c Release --filter NamedPipeHandshakeTests
      - name: Backend PS5.1 contract smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/backend/Invoke-WorkbenchBackendContractSmoke.ps1
      - name: Backend live snapshot smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/backend/Invoke-WorkbenchBackendSnapshotSmoke.ps1
      - name: WPF shell load smoke
        shell: powershell
        run: dotnet test tests/desktop/MLLM.Workbench.Desktop.Tests/MLLM.Workbench.Desktop.Tests.csproj -c Release --filter ShellContractTests
      - name: Desktop self-contained publish smoke
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'mllm-phase-a-publish'
          dotnet publish src/MLLM.Workbench.Desktop/MLLM.Workbench.Desktop.csproj -c Release -r win-x64 --self-contained true -o $out
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $exe=Join-Path $out 'MLLM.Workbench.Desktop.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw "Desktop exe missing after self-contained publish: $exe"}
          Write-Host "DESKTOP_SELF_CONTAINED_PUBLISH=PASS exe=$exe"
      - name: Dashboard ViewModel tests
        shell: powershell
        run: dotnet test tests/desktop/MLLM.Workbench.Desktop.Tests/MLLM.Workbench.Desktop.Tests.csproj -c Release --filter DashboardViewModelTests
