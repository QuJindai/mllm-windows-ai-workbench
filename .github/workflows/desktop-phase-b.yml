name: desktop-phase-b

on:
  push:
    branches:
      - feature/desktop-phase-b
  pull_request:

permissions:
  contents: read

jobs:
  phase-b:
    name: Desktop Phase B / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: .NET 8 identity
        shell: powershell
        run: dotnet --info
      - name: Phase B contracts
        shell: powershell
        run: dotnet test tests/contracts/MLLM.Workbench.Contracts.Tests/MLLM.Workbench.Contracts.Tests.csproj -c Release --filter PhaseBContractSerializationTests
      - name: Phase B model adapter
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/runtime/Invoke-WorkbenchRuntimeAdapterModelSmoke.ps1
      - name: Phase B service adapter
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/runtime/Invoke-WorkbenchRuntimeAdapterServiceSmoke.ps1
      - name: Phase B service lifecycle
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/runtime/Invoke-WorkbenchRuntimeAdapterLifecycleSmoke.ps1
      - name: Phase B typed backend client
        shell: powershell
        run: dotnet test tests/infrastructure/MLLM.Workbench.Infrastructure.Tests/MLLM.Workbench.Infrastructure.Tests.csproj -c Release --filter PhaseBBackendClientTests
      - name: Phase B backend allowlist
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/backend/Invoke-WorkbenchBackendPhaseBContractSmoke.ps1
