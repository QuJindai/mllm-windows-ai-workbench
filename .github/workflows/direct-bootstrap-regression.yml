name: direct-bootstrap-regression

on:
  push:
    branches: [ safe-core ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-bootstrap-ps51:
    name: Direct Bootstrap / Windows PowerShell 5.1
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce direct raw Bootstrap invocation
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-DirectBootstrapSmoke.ps1
      - name: Full user R3 GUI preflight entrypoint
        shell: cmd
        run: M_LLM_WORKBENCH_FULL_TEST_R3.cmd --gui-preflight-only --refresh --no-pause
