name: knowledge-android-apk

on:
  push:
    branches:
      - feature/knowledge-android-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK / full device gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Core unit tests
        working-directory: android/knowledge-workbench
        run: gradle --no-daemon testDebugUnitTest
      - name: Android lint
        working-directory: android/knowledge-workbench
        run: gradle --no-daemon lintDebug
      - name: Compile app and instrumentation APKs
        working-directory: android/knowledge-workbench
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM_DEVICE_MISSING"
            exit 1
          fi
      - name: Repository and UI emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: cd android/knowledge-workbench && gradle --no-daemon connectedDebugAndroidTest
