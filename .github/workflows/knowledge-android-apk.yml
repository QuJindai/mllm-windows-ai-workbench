name: knowledge-android-apk

on:
  push:
    branches:
      - feature/knowledge-android-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK / core gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        shell: bash
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Core RED gate
        working-directory: android/knowledge-workbench
        run: gradle --no-daemon testDebugUnitTest
