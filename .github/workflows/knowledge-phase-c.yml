name: knowledge-phase-c

on:
  push:
    branches:
      - feature/knowledge-phase-c
  pull_request:

permissions:
  contents: read

jobs:
  knowledge:
    name: Knowledge Phase C / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Knowledge core tests
        shell: powershell
        run: dotnet test tests/knowledge/MLLM.Workbench.Knowledge.Tests/MLLM.Workbench.Knowledge.Tests.csproj -c Release
      - name: Native knowledge page view model
        shell: powershell
        run: dotnet test tests/desktop/MLLM.Workbench.Desktop.Tests/MLLM.Workbench.Desktop.Tests.csproj -c Release --filter KnowledgePageViewModelTests
      - name: Real knowledge workspace service
        shell: powershell
        run: dotnet test tests/desktop/MLLM.Workbench.Desktop.Tests/MLLM.Workbench.Desktop.Tests.csproj -c Release --filter KnowledgeWorkbenchServiceTests
      - name: Native knowledge shell integration
        shell: powershell
        run: dotnet test tests/desktop/MLLM.Workbench.Desktop.Tests/MLLM.Workbench.Desktop.Tests.csproj -c Release --filter KnowledgeShellIntegrationTests
