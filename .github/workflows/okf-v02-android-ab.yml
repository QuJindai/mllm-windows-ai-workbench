name: OKF v0.2 Android A-B Contract

on:
  push:
    branches:
      - feature/okf-v02-android-ab
    paths:
      - "s24u-image-harness/okf/**"
      - "s24u-image-harness/tests/test_okf_v02_contract.py"
      - ".github/workflows/okf-v02-android-ab.yml"
      - "docs/OKF_V02_ANDROID_AB_TAKEOVER.md"
  pull_request:
    paths:
      - "s24u-image-harness/okf/**"
      - "s24u-image-harness/tests/test_okf_v02_contract.py"
      - ".github/workflows/okf-v02-android-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okf-v02-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: OKF v0.2 parser and experiment contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: OKF v0.2 contract tests
        env:
          PYTHONPATH: s24u-image-harness
        run: python -m pytest -q s24u-image-harness/tests/test_okf_v02_contract.py
      - name: Record inherited handset baseline
        run: |
          git merge-base --is-ancestor 1449a03c04c1e81b414f040dceaf213b8651d494 HEAD
          echo "H6R4_GREEN_BASELINE=1449a03c04c1e81b414f040dceaf213b8651d494"
          echo "Android runtime/source gates are rerun when OKF work starts modifying the handset patch path."
