name: S24U Image Harness H4 V2

on:
  push:
    branches: [feature/s24u-image-harness-h4-visual-microscope]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-h4-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_SHA: a7666f6198412a58c6eb1eacc28828aa40c7d7ae
      NDK_VERSION: 28.2.13676358
      QAIRT_URL: https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.39.0.250926/v2.39.0.250926.zip
      SIGN_PASS: s24u-test-public
      SIGN_ALIAS: s24utest
      EXPECTED_CERT_SHA256: B60748D6461EF1F5E2681462F08EEBCA287B56B78BFAFC801499CC2BA461E005

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android/native environment
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' "ndk;${NDK_VERSION}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache
          rustup target add aarch64-linux-android
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"
          echo H4_V2_ENV_PASS

      - name: Clone pinned Local Dream
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/xororz/local-dream.git local-dream
          cd local-dream
          git checkout "$UPSTREAM_SHA"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: H2/H3 baseline GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h2.py local-dream | tee h2-patch.log
          python3 s24u-image-harness/tests/test_h2_source_contract.py local-dream | tee h2-green.log
          python3 s24u-image-harness/patch_h3.py local-dream | tee h3-patch.log
          python3 s24u-image-harness/patch_h3_capture_fix.py local-dream | tee h3-capture-fix.log
          python3 s24u-image-harness/tests/test_h3_microscope_contract.py local-dream | tee h3-green.log

      - name: H4 RED then V2 GREEN
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 s24u-image-harness/tests/test_h4_visual_microscope_contract.py local-dream > h4-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          grep -q 'H4 versionCode' h4-red.log
          echo H4_V2_RED_PASS

          python3 s24u-image-harness/patch_h4_v2.py local-dream | tee h4-v2-patch.log
          python3 s24u-image-harness/tests/test_h4_visual_microscope_contract.py local-dream | tee h4-v2-green.log
          python3 -m py_compile s24u-image-harness/patch_h4.py s24u-image-harness/patch_h4_v2.py s24u-image-harness/tests/test_h4_visual_microscope_contract.py
          grep -F 'const content = Math.max(posInput, 0);' local-dream/app/src/main/assets/s24u_microscope/microscope.js
          grep -F 'Cross-attention：未采集' local-dream/app/src/main/assets/s24u_microscope/index.html
          echo H4_V2_SOURCE_GREEN_PASS

      - name: Download QAIRT Community SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qairt
          curl -L --fail --retry 4 --retry-all-errors "$QAIRT_URL" -o /tmp/qairt.zip
          unzip -q /tmp/qairt.zip -d /tmp/qairt
          HEADER="$(find /tmp/qairt -type f -path '*/include/QNN/QnnTypes.h' -print -quit)"
          test -n "$HEADER"
          QNN_ROOT="$(dirname "$(dirname "$(dirname "$HEADER")")")"
          test -s "$QNN_ROOT/lib/aarch64-android/libQnnHtp.so"
          echo "QNN_SDK_ROOT=$QNN_ROOT" >> "$GITHUB_ENV"

      - name: Build H4 QNN native core
        id: native
        shell: bash
        run: |
          set -uo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          set +e
          bash s24u-image-harness/build_native_h2.sh 2>&1 | tee native-h4-v2.log
          status=${PIPESTATUS[0]}
          set -e
          grep -nE 'error:|fatal error:|undefined reference|FAILED:|ninja: build stopped|CMake Error' native-h4-v2.log | tail -120 | tee native-h4-v2-errors.log || true
          echo "NATIVE_EXIT=$status" >> native-h4-v2-errors.log
          test "$status" -eq 0
          CORE=local-dream/app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so
          test -s "$CORE"
          strings "$CORE" | grep -F 'positive_truncated_tokens' | head -1
          strings "$CORE" | grep -F 'event: trace' | head -1
          echo H4_V2_NATIVE_PASS

      - name: Native failure evidence
        if: failure() && steps.native.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: s24u-h4-v2-native-failure
          path: |
            native-h4-v2.log
            native-h4-v2-errors.log
            h4-red.log
            h4-v2-patch.log
            h4-v2-green.log
          retention-days: 7

      - name: Stable TEST-ONLY keystore
        shell: bash
        run: |
          set -euo pipefail
          openssl pkcs12 -export -inkey s24u-image-harness/signing/s24u-test-signing-key.pem -in s24u-image-harness/signing/s24u-test-signing-cert.pem -name "$SIGN_ALIAS" -out /tmp/s24u-test.p12 -passout "pass:$SIGN_PASS"
          keytool -importkeystore -noprompt -srckeystore /tmp/s24u-test.p12 -srcstoretype PKCS12 -srcstorepass "$SIGN_PASS" -srcalias "$SIGN_ALIAS" -destkeystore /tmp/s24u-test.jks -deststoretype JKS -deststorepass "$SIGN_PASS" -destkeypass "$SIGN_PASS" -destalias "$SIGN_ALIAS"

      - name: Gradle tests and H4 APK
        id: gradle
        shell: bash
        run: |
          set -uo pipefail
          cd local-dream
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace -PRELEASE_STORE_FILE=/tmp/s24u-test.jks -PRELEASE_STORE_PASSWORD="$SIGN_PASS" -PRELEASE_KEY_ALIAS="$SIGN_ALIAS" -PRELEASE_KEY_PASSWORD="$SIGN_PASS" testBasicDebugUnitTest assembleBasicDebug 2>&1 | tee ../gradle-h4-v2.log
          status=${PIPESTATUS[0]}
          set -e
          echo "GRADLE_EXIT=$status" | tee ../gradle-h4-v2-status.txt
          exit "$status"

      - name: Gradle failure evidence
        if: failure() && steps.gradle.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: s24u-h4-v2-gradle-failure
          path: |
            gradle-h4-v2.log
            gradle-h4-v2-status.txt
            h4-v2-green.log
          retention-days: 7

      - name: Preserve and verify H4 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find local-dream/app/build/outputs/apk/basic/debug -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          cp "$APK" S24U_Image_Harness_H4_20260831.apk
          sha256sum S24U_Image_Harness_H4_20260831.apk | tee H4_APK_SHA256SUMS.txt
          stat -c 'APK_BYTES=%s' S24U_Image_Harness_H4_20260831.apk | tee H4_APK_SIZE.txt

          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT2" dump badging "$APK" | tee apk-badging-h4-v2.txt
          grep -q "package: name='io.github.xororz.localdream.s24uharness'" apk-badging-h4-v2.txt
          grep -q "versionCode='7404'" apk-badging-h4-v2.txt
          grep -q "versionName='2.8.1-s24u-h4'" apk-badging-h4-v2.txt

          zipinfo -1 "$APK" | tee apk-files-h4-v2.txt
          grep -q '^lib/arm64-v8a/libstable_diffusion_core.so$' apk-files-h4-v2.txt
          grep -q '^assets/qnnlibs/libQnnHtp.so$' apk-files-h4-v2.txt
          grep -q '^assets/s24u_microscope/index.html$' apk-files-h4-v2.txt
          grep -q '^assets/s24u_microscope/microscope.css$' apk-files-h4-v2.txt
          grep -q '^assets/s24u_microscope/microscope.js$' apk-files-h4-v2.txt
          ! grep -q 'safety_checker.mnn' apk-files-h4-v2.txt

          unzip -p "$APK" assets/s24u_microscope/index.html | grep -F 'Cross-attention：未采集'
          unzip -p "$APK" assets/s24u_microscope/microscope.js | grep -F 'const content = Math.max(posInput, 0);'
          unzip -p "$APK" assets/s24u_microscope/microscope.js | grep -F 'renderTimeline'
          unzip -p "$APK" assets/s24u_microscope/microscope.css | grep -F '.timeline-bar'

          unzip -p "$APK" lib/arm64-v8a/libstable_diffusion_core.so > /tmp/h4-core.so
          strings /tmp/h4-core.so | grep -F 'positive_truncated_tokens' | head -1
          strings /tmp/h4-core.so | grep -F 'event: trace' | head -1

          found=0
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -Fq 'S24U_H4_VISUAL_MICROSCOPE'; then
              found=1
              break
            fi
          done < <(zipinfo -1 "$APK" | grep -E '^classes[0-9]*\.dex$')
          test "$found" -eq 1

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signing-h4-v2.txt
          CERT_HEX="$(grep -i 'Signer #1 certificate SHA-256 digest:' apk-signing-h4-v2.txt | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT_HEX" = "$EXPECTED_CERT_SHA256"
          sha256sum -c H4_APK_SHA256SUMS.txt
          echo H4_V2_APK_VERIFICATION_PASS | tee apk-verification-h4-v2.txt

      - name: Upload H4 phone-test package
        uses: actions/upload-artifact@v4
        with:
          name: s24u-image-harness-h4-v2
          path: |
            S24U_Image_Harness_H4_20260831.apk
            H4_APK_SHA256SUMS.txt
            H4_APK_SIZE.txt
            h2-green.log
            h3-green.log
            h4-red.log
            h4-v2-patch.log
            h4-v2-green.log
            native-h4-v2.log
            native-h4-v2-errors.log
            gradle-h4-v2.log
            gradle-h4-v2-status.txt
            apk-badging-h4-v2.txt
            apk-files-h4-v2.txt
            apk-signing-h4-v2.txt
            apk-verification-h4-v2.txt
          if-no-files-found: error
          retention-days: 7
