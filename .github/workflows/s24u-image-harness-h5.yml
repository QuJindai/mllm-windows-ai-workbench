name: S24U Image Harness H5

on:
  push:
    branches: [feature/s24u-image-harness-h5-process-microscope]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h5-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UPSTREAM_SHA: a7666f6198412a58c6eb1eacc28828aa40c7d7ae
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned Local Dream
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/xororz/local-dream.git local-dream
          cd local-dream
          git checkout "$UPSTREAM_SHA"
          git submodule update --init --recursive
      - name: Apply H2 H3 H4 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h2.py local-dream
          python3 s24u-image-harness/patch_h3.py local-dream
          python3 s24u-image-harness/patch_h3_capture_fix.py local-dream
          python3 s24u-image-harness/patch_h4_v2.py local-dream
          python3 s24u-image-harness/tests/test_h4_visual_microscope_contract.py local-dream
      - name: H5 RED expected fail
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 s24u-image-harness/tests/test_h5_process_microscope_contract.py local-dream > h5-red.log 2>&1
          code=$?
          set -e
          cat h5-red.log
          test "$code" -ne 0
          grep -q 'H5 versionCode' h5-red.log
          echo H5_RED_EXPECTED_FAIL_PASS
      - name: Apply H5 V2
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h5_v2.py local-dream | tee h5-patch.log
      - name: H5 GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/tests/test_h5_process_microscope_contract.py local-dream | tee h5-green.log
          python3 -m py_compile s24u-image-harness/patch_h5.py s24u-image-harness/patch_h5_v2.py s24u-image-harness/tests/test_h5_process_microscope_contract.py
          echo H5_SOURCE_GREEN_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: s24u-h5-source-evidence
          path: |
            h5-red.log
            h5-patch.log
            h5-green.log
          retention-days: 7
