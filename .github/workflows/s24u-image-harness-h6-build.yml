name: S24U Image Harness H6 Build

on:
  push:
    branches: [feature/s24u-image-harness-h6-conditioning-influence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h6-source-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UPSTREAM_SHA: a7666f6198412a58c6eb1eacc28828aa40c7d7ae
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned Local Dream
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/xororz/local-dream.git local-dream
          cd local-dream
          git checkout "$UPSTREAM_SHA"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Apply verified H2 H3 H4 H5 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h2.py local-dream
          python3 s24u-image-harness/tests/test_h2_source_contract.py local-dream
          python3 s24u-image-harness/patch_h3.py local-dream
          python3 s24u-image-harness/patch_h3_capture_fix.py local-dream
          python3 s24u-image-harness/tests/test_h3_microscope_contract.py local-dream
          python3 s24u-image-harness/patch_h4_v2.py local-dream
          python3 s24u-image-harness/tests/test_h4_visual_microscope_contract.py local-dream
          python3 s24u-image-harness/patch_h5_v2.py local-dream
          python3 s24u-image-harness/tests/test_h5_process_microscope_contract.py local-dream

      - name: H6 RED then GREEN source contract
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 s24u-image-harness/tests/test_h6_conditioning_influence_contract.py local-dream > h6-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          grep -Fq "H6 versionCode: missing 'versionCode = 7406'" h6-red.log
          echo H6_RED_PASS
          python3 s24u-image-harness/patch_h6.py local-dream | tee h6-patch.log
          python3 s24u-image-harness/tests/test_h6_conditioning_influence_contract.py local-dream | tee h6-green.log
          python3 -m py_compile s24u-image-harness/patch_h6.py s24u-image-harness/tests/test_h6_conditioning_influence_contract.py
          echo H6_SOURCE_GREEN_PASS

      - name: Source failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s24u-h6-source-failure
          path: |
            h6-red.log
            h6-patch.log
            h6-green.log
          if-no-files-found: warn
          retention-days: 7
