name: S24U Image Harness H6R1 Gesture Fix

on:
  push:
    branches: [feature/s24u-image-harness-h6-conditioning-influence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-h6r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_SHA: a7666f6198412a58c6eb1eacc28828aa40c7d7ae
      NDK_VERSION: 28.2.13676358
      QAIRT_URL: https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.39.0.250926/v2.39.0.250926.zip
      SIGN_PASS: s24u-test-public
      SIGN_ALIAS: s24utest
      EXPECTED_CERT_SHA256: B60748D6461EF1F5E2681462F08EEBCA287B56B78BFAFC801499CC2BA461E005

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android and native environment
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' "ndk;${NDK_VERSION}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache
          rustup target add aarch64-linux-android
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"
          echo H6R1_ENV_PASS

      - name: Clone pinned Local Dream
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/xororz/local-dream.git local-dream
          cd local-dream
          git checkout "$UPSTREAM_SHA"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Apply H2 through H6 V3 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h2.py local-dream
          python3 s24u-image-harness/tests/test_h2_source_contract.py local-dream | tee h2-green.log
          python3 s24u-image-harness/patch_h3.py local-dream
          python3 s24u-image-harness/patch_h3_capture_fix.py local-dream
          python3 s24u-image-harness/tests/test_h3_microscope_contract.py local-dream | tee h3-green.log
          python3 s24u-image-harness/patch_h4_v2.py local-dream
          python3 s24u-image-harness/tests/test_h4_visual_microscope_contract.py local-dream | tee h4-green.log
          python3 s24u-image-harness/patch_h5_v2.py local-dream
          python3 s24u-image-harness/tests/test_h5_process_microscope_contract.py local-dream | tee h5-green.log
          python3 s24u-image-harness/patch_h6.py local-dream
          python3 s24u-image-harness/patch_h6_v2.py local-dream
          python3 s24u-image-harness/patch_h6_v3.py local-dream
          python3 s24u-image-harness/tests/test_h6_conditioning_influence_contract.py local-dream | tee h6-green.log

      - name: H6R1 gesture RED then GREEN
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 s24u-image-harness/tests/test_h6r1_gesture_contract.py local-dream > h6r1-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          grep -Fq "H6R1 versionCode: missing 'versionCode = 7407'" h6r1-red.log
          echo H6R1_RED_PASS

          PIPE=local-dream/app/src/main/cpp/src/Pipeline.hpp
          SERVICE=local-dream/app/src/main/java/io/github/xororz/localdream/service/BackgroundGenerationService.kt
          JS=local-dream/app/src/main/assets/s24u_microscope/microscope.js
          pipe_before="$(sha256sum "$PIPE" | awk '{print $1}')"
          service_before="$(sha256sum "$SERVICE" | awk '{print $1}')"
          js_before="$(sha256sum "$JS" | awk '{print $1}')"

          python3 s24u-image-harness/patch_h6_v4_gesture.py local-dream | tee h6r1-patch.log
          python3 s24u-image-harness/tests/test_h6r1_gesture_contract.py local-dream | tee h6r1-green.log
          python3 s24u-image-harness/tests/test_h6_conditioning_influence_contract.py local-dream | tee h6-regression.log

          pipe_after="$(sha256sum "$PIPE" | awk '{print $1}')"
          service_after="$(sha256sum "$SERVICE" | awk '{print $1}')"
          js_after="$(sha256sum "$JS" | awk '{print $1}')"
          test "$pipe_before" = "$pipe_after"
          test "$service_before" = "$service_after"
          test "$js_before" = "$js_after"
          echo H6R1_NO_INFERENCE_OR_BRIDGE_MUTATION_PASS | tee h6r1-no-core-mutation.log

          python3 -m py_compile \
            s24u-image-harness/patch_h6_v4_gesture.py \
            s24u-image-harness/tests/test_h6r1_gesture_contract.py
          echo H6R1_SOURCE_GREEN_PASS

      - name: Download QAIRT Community SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qairt
          curl -L --fail --retry 4 --retry-all-errors "$QAIRT_URL" -o /tmp/qairt.zip
          unzip -q /tmp/qairt.zip -d /tmp/qairt
          HEADER="$(find /tmp/qairt -type f -path '*/include/QNN/QnnTypes.h' -print -quit)"
          test -n "$HEADER"
          QNN_ROOT="$(dirname "$(dirname "$(dirname "$HEADER")")")"
          test -s "$QNN_ROOT/lib/aarch64-android/libQnnHtp.so"
          echo "QNN_SDK_ROOT=$QNN_ROOT" >> "$GITHUB_ENV"

      - name: Build H6R1 QNN native core
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash s24u-image-harness/build_native_h2.sh 2>&1 | tee native-h6r1.log
          CORE=local-dream/app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so
          test -s "$CORE"
          strings "$CORE" > /tmp/h6r1-native-strings.txt
          grep -F -m1 'conditioning_influence' /tmp/h6r1-native-strings.txt
          grep -F -m1 'influence_delta_l2' /tmp/h6r1-native-strings.txt
          grep -F -m1 'latent_map' /tmp/h6r1-native-strings.txt
          echo H6R1_NATIVE_PASS

      - name: Stable TEST-ONLY keystore
        shell: bash
        run: |
          set -euo pipefail
          openssl pkcs12 -export -inkey s24u-image-harness/signing/s24u-test-signing-key.pem -in s24u-image-harness/signing/s24u-test-signing-cert.pem -name "$SIGN_ALIAS" -out /tmp/s24u-test.p12 -passout "pass:$SIGN_PASS"
          keytool -importkeystore -noprompt -srckeystore /tmp/s24u-test.p12 -srcstoretype PKCS12 -srcstorepass "$SIGN_PASS" -srcalias "$SIGN_ALIAS" -destkeystore /tmp/s24u-test.jks -deststoretype JKS -deststorepass "$SIGN_PASS" -destkeypass "$SIGN_PASS" -destalias "$SIGN_ALIAS"

      - name: Gradle tests and H6R1 APK
        shell: bash
        run: |
          set -euo pipefail
          cd local-dream
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=/tmp/s24u-test.jks \
            -PRELEASE_STORE_PASSWORD="$SIGN_PASS" \
            -PRELEASE_KEY_ALIAS="$SIGN_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$SIGN_PASS" \
            testBasicDebugUnitTest assembleBasicDebug 2>&1 | tee ../gradle-h6r1.log

      - name: Preserve and verify H6R1 APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="$(find local-dream/app/build/outputs/apk/basic/debug -type f -name '*.apk' -print -quit)"
          test -s "$APK_SRC"
          APK=S24U_Image_Harness_H6R1_20260901.apk
          cp "$APK_SRC" "$APK"
          sha256sum "$APK" | tee H6R1_APK_SHA256SUMS.txt
          stat -c 'APK_BYTES=%s' "$APK" | tee H6R1_APK_SIZE.txt

          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT2" dump badging "$APK" > apk-badging-h6r1.txt
          grep -F "package: name='io.github.xororz.localdream.s24uharness'" apk-badging-h6r1.txt
          grep -F "versionCode='7407'" apk-badging-h6r1.txt
          grep -F "versionName='2.8.1-s24u-h6r1'" apk-badging-h6r1.txt

          zipinfo -1 "$APK" > apk-files-h6r1.txt
          unzip -p "$APK" assets/s24u_microscope/microscope.css > /tmp/microscope-h6r1.css
          grep -F 'touch-action:pan-y' /tmp/microscope-h6r1.css
          grep -F 'overscroll-behavior-x:none' /tmp/microscope-h6r1.css
          grep -F 'touch-action:pan-x' /tmp/microscope-h6r1.css

          found_h6=0
          found_r1=0
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" > /tmp/current.dex
            strings /tmp/current.dex > /tmp/current.strings
            if grep -Fq 'S24U_H6_CONDITIONING_INFLUENCE' /tmp/current.strings; then found_h6=1; fi
            if grep -Fq 'S24U_H6R1_GESTURE_ARBITRATION' /tmp/current.strings; then found_r1=1; fi
          done < <(grep -E '^classes[0-9]*\.dex$' apk-files-h6r1.txt)
          test "$found_h6" -eq 1
          test "$found_r1" -eq 1

          "$APKSIGNER" verify --verbose --print-certs "$APK" > apk-signing-h6r1.txt
          CERT_HEX="$(grep -i 'Signer #1 certificate SHA-256 digest:' apk-signing-h6r1.txt | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT_HEX" = "$EXPECTED_CERT_SHA256"
          sha256sum -c H6R1_APK_SHA256SUMS.txt
          echo H6R1_APK_VERIFICATION_PASS | tee apk-verification-h6r1.txt

      - name: Upload H6R1 phone-test package
        uses: actions/upload-artifact@v4
        with:
          name: s24u-image-harness-h6r1-gesture-fix
          path: |
            S24U_Image_Harness_H6R1_20260901.apk
            H6R1_APK_SHA256SUMS.txt
            H6R1_APK_SIZE.txt
            h2-green.log
            h3-green.log
            h4-green.log
            h5-green.log
            h6-green.log
            h6r1-red.log
            h6r1-patch.log
            h6r1-green.log
            h6-regression.log
            h6r1-no-core-mutation.log
            native-h6r1.log
            gradle-h6r1.log
            apk-badging-h6r1.txt
            apk-files-h6r1.txt
            apk-signing-h6r1.txt
            apk-verification-h6r1.txt
          if-no-files-found: error
          retention-days: 7
