name: S24U Image Harness H6R3 RED

on:
  push:
    branches: [feature/s24u-image-harness-h6r3-semantic-fidelity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h6r3-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UPSTREAM_SHA: a7666f6198412a58c6eb1eacc28828aa40c7d7ae
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned Local Dream source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/xororz/local-dream.git local-dream
          cd local-dream
          git checkout "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Apply verified H2 through H6R2 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h2.py local-dream
          python3 s24u-image-harness/tests/test_h2_source_contract.py local-dream
          python3 s24u-image-harness/patch_h3.py local-dream
          python3 s24u-image-harness/patch_h3_capture_fix.py local-dream
          python3 s24u-image-harness/tests/test_h3_microscope_contract.py local-dream
          python3 s24u-image-harness/patch_h4_v2.py local-dream
          python3 s24u-image-harness/tests/test_h4_visual_microscope_contract.py local-dream
          python3 s24u-image-harness/patch_h5_v2.py local-dream
          python3 s24u-image-harness/tests/test_h5_process_microscope_contract.py local-dream
          python3 s24u-image-harness/patch_h6.py local-dream
          python3 s24u-image-harness/patch_h6_v2.py local-dream
          python3 s24u-image-harness/patch_h6_v3.py local-dream
          python3 s24u-image-harness/tests/test_h6_conditioning_influence_contract.py local-dream
          python3 s24u-image-harness/patch_h6_v4_gesture.py local-dream
          python3 s24u-image-harness/tests/test_h6r1_gesture_contract.py local-dream
          python3 s24u-image-harness/patch_h6_v5_observability.py local-dream
          python3 s24u-image-harness/tests/test_h6r2_observability_contract.py local-dream
          echo H6R2_BASELINE_PASS

      - name: Require H6R3 RED at missing version marker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 s24u-image-harness/tests/test_h6r3_semantic_fidelity_contract.py local-dream > h6r3-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          grep -Fq "H6R3 versionCode: missing 'versionCode = 7409'" h6r3-red.log
          echo H6R3_RED_PASS

      - name: Require CFG truth RED on H6R2
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 s24u-image-harness/tests/test_h6r3_cfg_truth_contract.py local-dream > h6r3-cfg-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          grep -Fq "H6R3 versionCode: missing 'versionCode = 7409'" h6r3-cfg-red.log
          echo H6R3_CFG_RED_PASS

      - name: Stage patched H6R2 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h6r2-source/app/src/main/cpp/src
          mkdir -p h6r2-source/app/src/main/java/io/github/xororz/localdream/service
          mkdir -p h6r2-source/app/src/main/java/io/github/xororz/localdream/ui/screens
          mkdir -p h6r2-source/app/src/main/assets/s24u_microscope
          cp local-dream/app/build.gradle.kts h6r2-source/app/
          cp local-dream/app/src/main/cpp/src/Pipeline.hpp h6r2-source/app/src/main/cpp/src/
          cp local-dream/app/src/main/cpp/src/main.cpp h6r2-source/app/src/main/cpp/src/
          cp local-dream/app/src/main/java/io/github/xororz/localdream/service/BackgroundGenerationService.kt h6r2-source/app/src/main/java/io/github/xororz/localdream/service/
          cp local-dream/app/src/main/java/io/github/xororz/localdream/ui/screens/ModelRunScreen.kt h6r2-source/app/src/main/java/io/github/xororz/localdream/ui/screens/
          cp local-dream/app/src/main/assets/s24u_microscope/* h6r2-source/app/src/main/assets/s24u_microscope/

      - name: Upload RED evidence and H6R2 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: h6r3-red-evidence
          path: |
            h6r3-red.log
            h6r3-cfg-red.log
            h6r2-source/**
          if-no-files-found: error
          retention-days: 7
