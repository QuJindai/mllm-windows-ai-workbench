name: S24U Image Harness H6R3 Source Gate

on:
  push:
    branches: [feature/s24u-image-harness-h6r3-semantic-fidelity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h6r3-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UPSTREAM_SHA: a7666f6198412a58c6eb1eacc28828aa40c7d7ae
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned Local Dream source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/xororz/local-dream.git local-dream
          cd local-dream
          git checkout "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Apply H2 through H6R2 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h2.py local-dream
          python3 s24u-image-harness/tests/test_h2_source_contract.py local-dream
          python3 s24u-image-harness/patch_h3.py local-dream
          python3 s24u-image-harness/patch_h3_capture_fix.py local-dream
          python3 s24u-image-harness/tests/test_h3_microscope_contract.py local-dream
          python3 s24u-image-harness/patch_h4_v2.py local-dream
          python3 s24u-image-harness/tests/test_h4_visual_microscope_contract.py local-dream
          python3 s24u-image-harness/patch_h5_v2.py local-dream
          python3 s24u-image-harness/tests/test_h5_process_microscope_contract.py local-dream
          python3 s24u-image-harness/patch_h6.py local-dream
          python3 s24u-image-harness/patch_h6_v2.py local-dream
          python3 s24u-image-harness/patch_h6_v3.py local-dream
          python3 s24u-image-harness/tests/test_h6_conditioning_influence_contract.py local-dream
          python3 s24u-image-harness/patch_h6_v4_gesture.py local-dream
          python3 s24u-image-harness/tests/test_h6r1_gesture_contract.py local-dream
          python3 s24u-image-harness/patch_h6_v5_observability.py local-dream
          python3 s24u-image-harness/tests/test_h6r2_observability_contract.py local-dream
          echo H2_THROUGH_H6R2_STAGED_BASELINE_PASS

      - name: Task 2 CFG truth RED then GREEN
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 s24u-image-harness/tests/test_h6r3_cfg_truth_contract.py local-dream > h6r3-cfg-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          python3 s24u-image-harness/patch_h6_v6_semantic_fidelity.py local-dream | tee h6r3-cfg-patch.log
          python3 s24u-image-harness/tests/test_h6r3_cfg_truth_contract.py local-dream | tee h6r3-cfg-green.log
          python3 s24u-image-harness/tests/test_h6_conditioning_influence_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r1_gesture_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r2_observability_contract.py local-dream
          echo H6R3_TASK2_PASS

      - name: Task 3 fusion RED and model-call baseline
        shell: bash
        run: |
          set -euo pipefail
          PIPE=local-dream/app/src/main/cpp/src/Pipeline.hpp
          grep -c 'runUnetStep(' "$PIPE" > unet-step-before-fusion.txt
          grep -c 'runUnetTiled(' "$PIPE" > unet-tiled-before-fusion.txt
          set +e
          python3 s24u-image-harness/tests/test_h6r3_fusion_lab_contract.py local-dream > h6r3-fusion-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          python3 s24u-image-harness/patch_h6_v7_fusion_core_v2.py local-dream | tee h6r3-fusion-core.log
          python3 s24u-image-harness/patch_h6_v7_fusion_android.py local-dream | tee h6r3-fusion-android.log
          python3 s24u-image-harness/tests/test_h6r3_fusion_lab_contract.py local-dream | tee h6r3-fusion-green.log
          grep -c 'runUnetStep(' "$PIPE" > unet-step-after-fusion.txt
          grep -c 'runUnetTiled(' "$PIPE" > unet-tiled-after-fusion.txt
          diff -u unet-step-before-fusion.txt unet-step-after-fusion.txt
          diff -u unet-tiled-before-fusion.txt unet-tiled-after-fusion.txt
          echo H6R3_TASK3_PASS

      - name: Task 4 Process Dynamics RED and model-call baseline
        shell: bash
        run: |
          set -euo pipefail
          PIPE=local-dream/app/src/main/cpp/src/Pipeline.hpp
          grep -c 'runUnetStep(' "$PIPE" > unet-step-before-dynamics.txt
          grep -c 'runUnetTiled(' "$PIPE" > unet-tiled-before-dynamics.txt
          grep -c 'encodePromptChunks(' "$PIPE" > clip-before-dynamics.txt
          grep -c 'vaeDecode(' "$PIPE" > vae-before-dynamics.txt
          set +e
          python3 s24u-image-harness/tests/test_h6r3_process_dynamics_contract.py local-dream > h6r3-dynamics-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          grep -Fq "native latent_delta: missing 'latent_delta'" h6r3-dynamics-red.log
          python3 s24u-image-harness/patch_h6_v8_dynamics_core.py local-dream | tee h6r3-dynamics-core.log
          python3 s24u-image-harness/patch_h6_v8_dynamics_android.py local-dream | tee h6r3-dynamics-android.log
          python3 s24u-image-harness/patch_h6_v8_dynamics_ui.py local-dream | tee h6r3-dynamics-ui.log
          python3 s24u-image-harness/tests/test_h6r3_process_dynamics_contract.py local-dream | tee h6r3-dynamics-green.log
          grep -c 'runUnetStep(' "$PIPE" > unet-step-after-dynamics.txt
          grep -c 'runUnetTiled(' "$PIPE" > unet-tiled-after-dynamics.txt
          grep -c 'encodePromptChunks(' "$PIPE" > clip-after-dynamics.txt
          grep -c 'vaeDecode(' "$PIPE" > vae-after-dynamics.txt
          diff -u unet-step-before-dynamics.txt unet-step-after-dynamics.txt
          diff -u unet-tiled-before-dynamics.txt unet-tiled-after-dynamics.txt
          diff -u clip-before-dynamics.txt clip-after-dynamics.txt
          diff -u vae-before-dynamics.txt vae-after-dynamics.txt
          python3 s24u-image-harness/tests/test_h6r2_observability_contract.py local-dream
          echo H6R3_TASK4_PASS

      - name: Task 5 Latent State Inspector RED and model-call baseline
        shell: bash
        run: |
          set -euo pipefail
          PIPE=local-dream/app/src/main/cpp/src/Pipeline.hpp
          grep -c 'runUnetStep(' "$PIPE" > unet-step-before-latent.txt
          grep -c 'runUnetTiled(' "$PIPE" > unet-tiled-before-latent.txt
          grep -c 'encodePromptChunks(' "$PIPE" > clip-before-latent.txt
          grep -c 'vaeDecode(' "$PIPE" > vae-before-latent.txt
          set +e
          python3 s24u-image-harness/tests/test_h6r3_latent_inspector_contract.py local-dream > h6r3-latent-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          grep -Fq "native channel_stats: missing 'channel_stats'" h6r3-latent-red.log
          echo H6R3_LATENT_RED_PASS

      - name: Apply H6R3 Latent State Inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h6_v9_latent_core.py local-dream | tee h6r3-latent-core.log
          python3 s24u-image-harness/patch_h6_v9_latent_android.py local-dream | tee h6r3-latent-android.log
          python3 s24u-image-harness/patch_h6_v9_latent_ui.py local-dream | tee h6r3-latent-ui.log
          python3 -m py_compile \
            s24u-image-harness/patch_h6_v9_latent_core.py \
            s24u-image-harness/patch_h6_v9_latent_android.py \
            s24u-image-harness/patch_h6_v9_latent_ui.py

      - name: Task 5 GREEN with zero extra model calls
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/tests/test_h6r3_latent_inspector_contract.py local-dream | tee h6r3-latent-green.log
          PIPE=local-dream/app/src/main/cpp/src/Pipeline.hpp
          grep -c 'runUnetStep(' "$PIPE" > unet-step-after-latent.txt
          grep -c 'runUnetTiled(' "$PIPE" > unet-tiled-after-latent.txt
          grep -c 'encodePromptChunks(' "$PIPE" > clip-after-latent.txt
          grep -c 'vaeDecode(' "$PIPE" > vae-after-latent.txt
          diff -u unet-step-before-latent.txt unet-step-after-latent.txt
          diff -u unet-tiled-before-latent.txt unet-tiled-after-latent.txt
          diff -u clip-before-latent.txt clip-after-latent.txt
          diff -u vae-before-latent.txt vae-after-latent.txt
          python3 s24u-image-harness/tests/test_h6r3_cfg_truth_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r3_fusion_lab_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r3_process_dynamics_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6_conditioning_influence_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r1_gesture_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r2_observability_contract.py local-dream
          echo H6R3_TASK5_PASS

      - name: Prove remaining H6R3 work is RED at Runtime Compute Graph
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 s24u-image-harness/tests/test_h6r3_semantic_fidelity_contract.py local-dream > h6r3-remaining-red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          grep -Fq "runtime compute graph heading: missing 'RUNTIME COMPUTE GRAPH'" h6r3-remaining-red.log
          echo H6R3_REMAINING_RED_AT_RUNTIME_GRAPH_PASS

      - name: Upload H6R3 Task 2-5 source evidence
        uses: actions/upload-artifact@v4
        with:
          name: h6r3-task2-task5-source-evidence
          path: |
            h6r3-*.log
            *-before-*.txt
            *-after-*.txt
          if-no-files-found: error
          retention-days: 7
