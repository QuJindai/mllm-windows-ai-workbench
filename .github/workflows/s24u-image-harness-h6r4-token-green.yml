name: S24U Image Harness H6R4 Token GREEN

on:
  push:
    branches: [feature/s24u-image-harness-h6r4-token-truth]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UPSTREAM_SHA: a7666f6198412a58c6eb1eacc28828aa40c7d7ae
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned Local Dream
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/xororz/local-dream.git local-dream
          cd local-dream
          git checkout "$UPSTREAM_SHA"
          git submodule update --init --recursive
      - name: Apply H2 through H6R3 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h2.py local-dream
          python3 s24u-image-harness/patch_h3.py local-dream
          python3 s24u-image-harness/patch_h3_capture_fix.py local-dream
          python3 s24u-image-harness/patch_h4_v2.py local-dream
          python3 s24u-image-harness/patch_h5_v2.py local-dream
          python3 s24u-image-harness/patch_h6.py local-dream
          python3 s24u-image-harness/patch_h6_v2.py local-dream
          python3 s24u-image-harness/patch_h6_v3.py local-dream
          python3 s24u-image-harness/patch_h6_v4_gesture.py local-dream
          python3 s24u-image-harness/patch_h6_v5_observability.py local-dream
          python3 s24u-image-harness/patch_h6_v6_semantic_fidelity.py local-dream
          python3 s24u-image-harness/patch_h6_v7_fusion_core_v2.py local-dream
          python3 s24u-image-harness/patch_h6_v7_fusion_android.py local-dream
          python3 s24u-image-harness/patch_h6_v8_dynamics_core.py local-dream
          python3 s24u-image-harness/patch_h6_v8_dynamics_android.py local-dream
          python3 s24u-image-harness/patch_h6_v8_dynamics_ui.py local-dream
          python3 s24u-image-harness/patch_h6_v9_latent_core.py local-dream
          python3 s24u-image-harness/patch_h6_v9_latent_android.py local-dream
          python3 s24u-image-harness/patch_h6_v9_latent_ui.py local-dream
          python3 s24u-image-harness/patch_h6_v10_runtime_graph.py local-dream
      - name: Apply H6R4 direct-token truth patch
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/patch_h6_v11_token_truth_v2.py local-dream | tee h6r4-token-patch.log
      - name: Verify token-truth slice and isolate remaining runtime work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('local-dream')
          te=(root/'app/src/main/cpp/src/TextEncoder.hpp').read_text()
          pipe=(root/'app/src/main/cpp/src/Pipeline.hpp').read_text()
          main=(root/'app/src/main/cpp/src/main.cpp').read_text()
          service=(root/'app/src/main/java/io/github/xororz/localdream/service/BackgroundGenerationService.kt').read_text()
          screen=(root/'app/src/main/java/io/github/xororz/localdream/ui/screens/ModelRunScreen.kt').read_text()
          js=(root/'app/src/main/assets/s24u_microscope/microscope.js').read_text()
          gradle=(root/'app/build.gradle.kts').read_text()
          req=[
            ('versionCode = 7410',gradle),
            ('2.8.1-s24u-h6r4',gradle),
            ('processWeightedPromptChunks',te),
            ('processPromptPairChunks',te),
            ('content_ids',te),
            ('content_weights',te),
            ('processPromptPairChunks',pipe),
            ('positive_content_tokens',pipe),
            ('negative_content_tokens',pipe),
            ('"positive_chunk_token_ids"',main),
            ('"negative_chunk_token_ids"',main),
            ('"positive_token_preserved"',main),
            ('"negative_token_preserved"',main),
            ('positiveTokenPreserved',service),
            ('negativeTokenPreserved',service),
            ('negativePromptPresent',service),
            ('negativeClipExecuted',service),
            ('negativeUnetExecuted',service),
            ('put("positive_token_preserved"',screen),
            ('TOKEN PRESERVATION',js),
            ('Negative CLIP',js),
            ('Negative UNet',js),
          ]
          for needle,text in req:
            assert needle in text, needle
          assert 'splitPromptChunks(req.prompt)' not in pipe
          assert 'splitPromptChunks(req.negative_prompt)' not in pipe
          assert 'promptContentTokenCount(fusion_pos_chunks[j])' not in pipe
          assert 'promptContentTokenCount(fusion_neg_chunks[j])' not in pipe
          print('H6R4_TOKEN_TRUTH_SLICE_PASS')
          PY
          set +e
          python3 s24u-image-harness/tests/test_h6r4_token_truth_contract.py local-dream > h6r4-full-after-token.log 2>&1
          rc=$?
          set -e
          cat h6r4-full-after-token.log
          test "$rc" -ne 0
          grep -E 'runtime truth field|runtime graph observed calls|runtime graph expected calls|Unattributed' h6r4-full-after-token.log
          echo H6R4_RUNTIME_TRUTH_REMAINS_RED
      - name: H6R3 regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 s24u-image-harness/tests/test_h6r3_cfg_truth_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r3_fusion_lab_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r3_process_dynamics_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r3_latent_inspector_contract.py local-dream
          python3 s24u-image-harness/tests/test_h6r3_runtime_graph_contract.py local-dream
