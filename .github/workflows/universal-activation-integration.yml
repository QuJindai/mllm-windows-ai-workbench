name: universal-activation-integration

on:
  push:
    branches: [ safe-core ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-integration:
    name: Activation Integration / Windows PowerShell 5.1
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Main entrypoint activation integration
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-ActivationIntegrationSmoke.ps1
