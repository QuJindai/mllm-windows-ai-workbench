name: universal-installer-ci

on:
  push:
    branches: [ safe-core ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ps51:
    name: Universal Installer / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 identity
        shell: powershell
        run: |
          if($PSVersionTable.PSVersion.Major -ne 5){throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"}
          Write-Host "UNIVERSAL_PS51=PASS version=$($PSVersionTable.PSVersion)"
      - name: Bootstrap paths and entrypoint
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-UniversalInstallerBootstrapSmoke.ps1
      - name: Resumable installer state
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-InstallerStateSmoke.ps1
      - name: Provider acquisition failover
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-AcquisitionFailoverSmoke.ps1
      - name: Package hash, extraction, and stage contract
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-PackageValidationSmoke.ps1
      - name: Version activation and rollback
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-VersionActivationSmoke.ps1
      - name: Main entrypoint activation integration
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-ActivationIntegrationSmoke.ps1
