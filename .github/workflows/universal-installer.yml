name: universal-installer-e2e

on:
  push:
    branches: [ safe-core ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-installer-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Universal Installer E2E / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 identity
        shell: powershell
        run: |
          if($PSVersionTable.PSVersion.Major -ne 5){throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"}
          Write-Host "UNIVERSAL_E2E_PS51=PASS version=$($PSVersionTable.PSVersion)"
      - name: Full isolated universal installer acceptance
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-UniversalInstallerE2E.ps1
