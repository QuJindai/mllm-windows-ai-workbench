name: universal-seed-ci

on:
  push:
    branches: [ safe-core ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Single-file Seed / Windows PowerShell 5.1
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize Safe Core source
        shell: powershell
        run: python ci/materialize.py
      - name: Build single-file universal installer seed
        shell: powershell
        run: python ci/build_universal_seed.py --output dist\M_LLM_UNIVERSAL_INSTALLER_FULL.cmd
      - name: Single-file offline smoke with narrowed PATH
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Invoke-SingleFileSeedSmoke.ps1 -SeedPath .\dist\M_LLM_UNIVERSAL_INSTALLER_FULL.cmd
