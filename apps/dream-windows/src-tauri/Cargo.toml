[package]
name = "dream-windows"
version = "0.1.0"
description = "Dream local image workstation Windows shell"
authors = ["Dream"]
edition = "2021"

[lib]
name = "dream_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
